services:
  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      - DEBUG=1
      - SERVICES=s3,ssm,secretsmanager,iam,sts
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=eu-west-1
      - AWS_DEFAULT_REGION=eu-west-1
    volumes:
      - localstack-data:/var/lib/localstack
    networks:
      - aws-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  terraform-local:
    image: hashicorp/terraform:1.13
    working_dir: /workspace/terraform_localstack
    volumes:
      - ./:/workspace
    tty: true
    stdin_open: true
    networks:
      - aws-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: uploads
    ports:
      - "5432:5432"
    volumes:
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aws-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d uploads" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./app
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localstack:4566
      TF_WORKSPACE: ${NAME:-default}
    networks:
      - aws-net
    ports:
      - "8080:8080"
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  localstack-data:

networks:
  aws-net: